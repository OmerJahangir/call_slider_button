name: call_slider_button
description: >-
  A beautiful, fully customizable Flutter widget that mimics an incoming call
  slider — swipe right to accept, swipe left to decline. Features smooth
  animations, haptic feedback, and extensive customization options.
version: 3.0.0
repository: https://github.com/OmerJahangir/call_slider_button
homepage: https://github.com/OmerJahangir/call_slider_button
issue_tracker: https://github.com/OmerJahangir/call_slider_button/issues
topics:
  - widget
  - slider
  - call
  - ui
  - animation
  - material-design

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0