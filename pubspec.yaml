name: call_slider_button
description: >-
  Customizable incoming-call slider for Flutter: swipe right to accept, left to
  decline. Smooth animations, haptic feedback and screen-reader support.
version: 3.0.1
repository: https://github.com/OmerJahangir/call_slider_button
homepage: https://github.com/OmerJahangir/call_slider_button
issue_tracker: https://github.com/OmerJahangir/call_slider_button/issues
topics:
  - widget
  - slider
  - call
  - animation
  - material-design

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0